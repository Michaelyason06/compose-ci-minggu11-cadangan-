services:
  # Service 1: Database MySQL
  db_mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wppass123
    volumes:
      - wp_data:/var/lib/mysql
    networks:
      - wp_network
    restart: always
 
  # Service 2: WordPress
  wordpress:
    image: wordpress:latest
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db_mysql
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wppass123
      WORDPRESS_DB_NAME: wordpress_db
    depends_on:
      - db_mysql
    networks:
      - wp_network
    restart: always
 
# Deklarasi volume permanen untuk data MySQL
volumes:
  wp_data:
 
# Deklarasi jaringan internal terisolasi
networks:
  wp_network:
    driver: bridge
